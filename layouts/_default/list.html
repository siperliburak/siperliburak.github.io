{{ define "main" }}
<article class="page-content">
  <p class="eyebrow">{{ .Site.Params.name }} · ACADEMIC WEBSITE</p>
  <h1>{{ .Title }}</h1>
  {{ with .Params.summary }}<p class="page-summary">{{ . }}</p>{{ end }}
  <div class="prose">{{ .Content }}</div>
  {{ range .Pages }}<section class="list-entry"><h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>{{ .Summary }}</section>{{ end }}
</article>
{{ end }}
